/* ─── Shanghai travel notebook | Jiangnan editorial system v1.9 ───
   Self-contained CSS decoration (no images, fonts or extra requests).
   Preserve content hierarchy, readable controls and home-only hero. */
:root{
 --ink-warm:#342c2b;--cinnabar:#9e302e;--vermillion:#bd4936;
 --antique-gold:#c79a53;--tea-paper:#fffaf0;--seal-jade:#286c62;
}
body{
 color:var(--ink-warm);
 background-color:#faf5eb;
 background-image:
   radial-gradient(circle at 14px 14px,rgba(154,99,45,.075) 1px,transparent 1.5px),
   radial-gradient(ellipse at 80% 0%,rgba(203,166,101,.15),transparent 45%),
   linear-gradient(180deg,#fbf5e9 0%,#fcf8f0 45%,#faf4e8 100%);
 background-size:28px 28px,100% 100%,100% 100%;
}
.shell{max-width:790px;padding-bottom:140px}
.page-intro{
 display:flex;align-items:center;justify-content:space-between;gap:12px;
 margin:12px 0 19px;padding:17px 17px 17px 20px;
 min-height:107px;
 border:1px solid #c98e56;
 border-bottom:3px solid #dcb878;
 border-radius:17px;
 background:
  radial-gradient(circle at 88% 30%,rgba(247,193,114,.13) 0 44px,transparent 45px),
  repeating-radial-gradient(circle at 95% 115%,transparent 0 13px,rgba(240,192,123,.085) 14px 16px,transparent 17px 29px),
  linear-gradient(117deg,#6e1f27,#952b30 58%,#ab3f35);
 box-shadow:0 6px 18px rgba(103,40,36,.13);
 overflow:hidden;
 position:relative;

/* Free translation: exact local phrase match, optional native Translator API, and public MyMemory service.
   Never store or log free-form text. Cloud translation is requested only by an explicit button press. */
function localPhraseTranslation(text,source){
 const normal=x=>String(x||'').normalize('NFKC').trim().replace(/[。.!！?？\s]+$/g,'').replace(/\s+/g,' ').toLowerCase();
 const query=normal(text);
 if(!query)return null;
 for(const [group,entries] of phraseGroups){
  for(const [zh,pinyin,ja] of entries){
   if(normal(source==='ja'?ja:zh)===query)return {text:source==='ja'?zh:ja,pinyin:source==='ja'?pinyin:'',method:'アプリ内の登録済みフレーズ（オフライン対応）'};
  }
 }
 return null;
}

function translationDeadline(task,ms,label,onTimeout){
 let timer;
 return Promise.race([
  Promise.resolve().then(()=>task),
  new Promise((_,reject)=>{timer=setTimeout(()=>{try{onTimeout?.()}catch{}reject(new Error(label+'がタイムアウトしました'))},ms)})
 ]).finally(()=>clearTimeout(timer));
}
async function freeTranslateText(text,source,environment){
 const q=String(text||'').trim(),target=source==='ja'?'zh':'ja';
 if(!q)throw Error('文章を入力してください。');
 if(!['ja','zh'].includes(source))throw Error('翻訳方向が正しくありません。');
 const phrase=localPhraseTranslation(q,source);if(phrase)return phrase;
 if(environment.offline)throw Error('オフラインで未登録の文章は翻訳できません。下のフレーズ集をご利用ください。');
 const bytes=new TextEncoder().encode(q).length;
 if(bytes>450)throw Error('無料翻訳の制限に合わせ、450バイト以内の短い文章にしてください。');
 // Android PWAでは翻訳モデルのダウンロード待機が終わらないケースがある。
 // 端末内モデルが既に利用可能なときだけ、短い制限時間内で試す。
 const Native=environment.NativeTranslator;
 if(Native&&typeof Native.availability==='function'&&typeof Native.create==='function'){
  try{
   const options={sourceLanguage:source,targetLanguage:target};
   const availability=await translationDeadline(Native.availability(options),1500,'端末内翻訳の確認');
   if(availability==='available'){
    const model=await translationDeadline(Native.create(options),2500,'端末内翻訳の起動');
    try{
     const result=await translationDeadline(model.translate(q),4000,'端末内翻訳');
     if(String(result||'').trim())return {text:String(result).trim(),pinyin:'',method:'ブラウザ内翻訳'};
    }finally{try{model.destroy?.()}catch{}}
   }
  }catch(error){console.warn('端末内翻訳から無料オンライン翻訳へ切り替え',error)}
 }
 const controller=new AbortController();
 try{
  const api='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)+'&langpair='+encodeURIComponent(source+'|'+(target==='zh'?'zh-CN':'ja'))+'&mt=1';
  const resp=await translationDeadline(
   environment.fetch(api,{method:'GET',cache:'no-store',signal:controller.signal}),
   8500,'オンライン翻訳',()=>controller.abort()
  );
  if(!resp.ok)throw Error('無料翻訳サービスに接続できません（HTTP '+resp.status+'）');
  const data=await translationDeadline(resp.json(),2000,'翻訳結果の読み込み');
  if(Number(data.responseStatus)!==200||!data.responseData||!String(data.responseData.translatedText||'').trim())throw Error(String(data.responseDetails||'翻訳結果を取得できません'));
  const output=String(data.responseData.translatedText).trim();
  if(/^(MYMEMORY WARNING|QUERY LENGTH LIMIT|PLEASE PROVIDE)/i.test(output))throw Error('無料翻訳サービスの利用上限に達しました');
  return {text:output,pinyin:'',method:'MyMemory無料翻訳（オンライン・文章は外部へ送信）'};
 }catch(error){
  if(error.name==='AbortError'||/タイムアウト/.test(error.message))throw Error('翻訳サービスが時間内に応答しませんでした。再試行してください。');
  throw error;
 }
}
function wireTranslator(){
 const input=document.getElementById('translateInput'),direction=document.getElementById('translateDirection');
 if(!input||!direction)return;
 const status=document.getElementById('translateStatus'),out=document.getElementById('translateOutput');
 const output=document.getElementById('translatedText'),pin=document.getElementById('translatedPinyin'),method=document.getElementById('translatedMethod');
 const submit=document.getElementById('translateSubmit'),swap=document.getElementById('translateSwap'),clear=document.getElementById('translateClear');
 const retry=document.getElementById('translateRetry');
 const copy=document.getElementById('translatedCopy'),show=document.getElementById('translatedShow'),speak=document.getElementById('translatedSpeak');
 let result='',pinyin='',original='',targetChinese=true,requestId=0;
 function reset(){requestId++;submit.disabled=false;out.hidden=true;retry.hidden=true;result='';pinyin='';original='';status.textContent='入力して翻訳ボタンを押してください。'}
 function updateDirection(){targetChinese=direction.value==='ja';show.hidden=!targetChinese;speak.hidden=!targetChinese}
 direction.onchange=()=>{reset();updateDirection()};
 swap.onclick=()=>{const previous=direction.value;direction.value=previous==='ja'?'zh':'ja';input.value=result||input.value;reset();updateDirection();input.focus()};
 clear.onclick=()=>{input.value='';reset();input.focus()};
 async function runTranslation(){
  const phrase=input.value.trim();if(!phrase){status.textContent='翻訳する文章を入力してください。';return}
  const thisRequest=++requestId,src=direction.value;
  submit.disabled=true;retry.hidden=true;out.hidden=true;
  status.textContent='翻訳しています… 通信状況によって最大15秒程度かかります。';
  try{
   const translated=await translationDeadline(
    freeTranslateText(phrase,src,{offline:!navigator.onLine,NativeTranslator:window.Translator,fetch:window.fetch.bind(window)}),
    15000,'翻訳の処理'
   );
   if(thisRequest!==requestId)return;
   result=translated.text;pinyin=translated.pinyin;original=phrase;
   output.textContent=result;pin.textContent=pinyin;pin.hidden=!pinyin;method.textContent=translated.method;
   out.hidden=false;status.textContent='翻訳できました。重要な内容は誤訳がないか確認してください。';updateDirection();
  }catch(error){
   if(thisRequest!==requestId)return;
   const reason=/タイムアウト/.test(String(error.message))?'応答がありませんでした（タイムアウト）。':(error.message||'通信エラー');
   status.textContent='翻訳できませんでした：'+reason+' 通信状態を確認して再試行するか、下の定型フレーズを利用してください。';
   retry.hidden=false;
  }finally{if(thisRequest===requestId)submit.disabled=false}
 }
 submit.onclick=runTranslation;
 retry.onclick=runTranslation;
 copy.onclick=async()=>{if(!result)return;try{await navigator.clipboard.writeText(result);copy.textContent='✓ コピーしました'}catch{prompt('こちらをコピーしてください',result)}};
 show.onclick=()=>{if(result&&targetChinese)openChineseShow(result,pinyin,original)};
 speak.onclick=()=>{
  if(!result||!targetChinese)return;
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){status.textContent='この端末では音声読み上げを利用できません。';return}
  try{window.speechSynthesis.cancel();const msg=new SpeechSynthesisUtterance(result);msg.lang='zh-CN';msg.rate=.85;window.speechSynthesis.speak(msg)}catch{status.textContent='中国語音声を再生できませんでした。'}
 };
 updateDirection();
}

/* Device-local multi-trip manager; original Shanghai storage keys stay intact. */
const MAIN_TRIP='shanghai-2026';
const MAIN_START='2026-12-30';
const MAIN_END='2027-01-02';
function allTrips(){const x=get('trips');return Array.isArray(x)?x.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string'):[]}
function selectedTrip(){const k=get('current-trip');return typeof k==='string'&&(k===MAIN_TRIP||allTrips().some(t=>t.id===k))?k:MAIN_TRIP}
function tripById(id){return allTrips().find(t=>t.id===id)}
function currentTrip(){return selectedTrip()===MAIN_TRIP?{id:MAIN_TRIP,title:'上海旅行 2026–27',start:MAIN_START,end:MAIN_END,currency:'CNY',days:[]}:tripById(selectedTrip())}
function activeDays(){const t=currentTrip();return t.id===MAIN_TRIP?days:(Array.isArray(t.days)?t.days:[])}
function tripExpenses(){const v=get('expenses-'+selectedTrip());return Array.isArray(v)?v:[]}
function validYmd(d){if(!/^\d{4}-\d{2}-\d{2}$/.test(d))return false;const x=new Date(d+'T00:00:00Z');return !Number.isNaN(x.getTime())&&x.toISOString().slice(0,10)===d}
function localTripDate(t){try{const zone=t.id===MAIN_TRIP?'Asia/Shanghai':undefined;const fmtOpts={year:'numeric',month:'2-digit',day:'2-digit',...(zone?{timeZone:zone}:{})};const x=new Intl.DateTimeFormat('en-CA',fmtOpts).formatToParts(new Date());const parts=Object.fromEntries(x.filter(p=>['year','month','day'].includes(p.type)).map(p=>[p.type,p.value]));return parts.year+'-'+parts.month+'-'+parts.day}catch{return new Date().toISOString().slice(0,10)}}
function localTripTime(t){try{return new Intl.DateTimeFormat('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false,...(t.id===MAIN_TRIP?{timeZone:'Asia/Shanghai'}:{})}).format(new Date())}catch{return '00:00'}}
function itineraryDates(t){if(t.id===MAIN_TRIP)return [MAIN_START,'2026-12-31','2027-01-01',MAIN_END];return (t.days||[]).map(d=>d.date)}
function eventTime(time){const m=String(time||'').match(/^(\d{1,2}):(\d{2})/);return m?+m[1]*60+(+m[2]):null}
function todayPanel(){
 const t=currentTrip(),ds=activeDays(),ymd=localTripDate(t),hm=localTripTime(t),dates=itineraryDates(t),idx=dates.indexOf(ymd);
 let head='<h2>📍 今日の予定・次の移動</h2><p class="muted">旅行先の日時：'+esc(ymd)+' '+esc(hm)+'（'+(t.id===MAIN_TRIP?'中国時間':'端末の現地時間')+'）</p>';
 if(!ds.length)return panel(head+'<p>旅行管理から予定を追加すると、ここに今日の行程が表示されます。</p>');
 if(idx>=0){const es=ds[idx].events||[],now=eventTime(hm);let upcoming=es.find(e=>eventTime(e[0])!==null&&eventTime(e[0])>=now);let next=upcoming||null;const move=es.find(e=>eventTime(e[0])!==null&&eventTime(e[0])>=now&&(/→|移動|駅へ|空港へ|タクシー|地下鉄|列車|高速鉄道|乗車/.test(e[1]+' '+(e[2]||''))));
 return panel(head+'<div class="hint"><strong>今日：</strong>'+esc(ds[idx].name||ds[idx].date||ymd)+'</div>'+(next?'<div class="card"><span class="time">次の予定 '+esc(next[0])+'</span><strong>'+esc(next[1])+'</strong><p class="muted">'+esc(next[2]||'')+'</p>'+(next[3]?mapPickButton(next[3],'目的地を地図で開く'):'')+'</div>':'<p>今日の登録済み行程は終了、または開始時刻のない予定のみです。</p>')+(move?'<div class="card"><span class="time">次の移動 '+esc(move[0])+'</span><strong>'+esc(move[1])+'</strong><p class="muted">'+esc(move[2]||'')+'</p>'+(move[3]?mapPickButton(move[3],'移動先を地図で開く'):'')+'</div>':'')+'<button class="ghost" data-today-day="'+idx+'">今日の詳細を見る</button>');}
 const future=dates.findIndex(d=>d>=ymd);const i=future>=0?future:ds.length-1;return panel(head+'<p class="muted">'+(future>=0?'次の予定日：':'旅行期間外です。最終日：')+esc(dates[i]||'')+'</p><div class="card"><strong>'+esc(ds[i].name||t.title)+'</strong><p class="muted">'+(ds[i].events||[]).length+'件の行程を登録済み</p></div><button class="ghost" data-today-day="'+i+'">日程を見る</button>');
}

async function importBackup(file){

 const obj=JSON.parse(await file.text());if(!obj||obj.format!=='shanghai-tabi-techo-backup'||obj.schema!==1||!obj.items||typeof obj.items!=='object'||Array.isArray(obj.items))throw Error('このアプリのバックアップ形式ではありません。');
 const entries=Object.entries(obj.items);
 if(entries.length>250)throw Error('保存項目数が上限を超えています。');
 for(const [k,v] of entries){if(!/^shanghai-free-[a-z0-9-]{1,90}$/.test(k)||typeof v!=='string'||v.length>1000000)throw Error('バックアップの内容に不正な項目があります。');JSON.parse(v)}
 if(!confirm(entries.length+'件の保存項目を復元します。同名のデータは上書きされます。よろしいですか？'))return false;
 const old=entries.map(([k])=>[k,localStorage.getItem(k)]);
 try{entries.forEach(([k,v])=>localStorage.setItem(k,v))}catch(err){old.forEach(([k,v])=>{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)});throw err}
 return true;
}

function settleExpenses(items){
 let selfPaid=0,friendPaid=0,selfShare=0,friendShare=0,unknown=0;
 for(const e of items){
  const amt=Number(e.amount),payer=String(e.payer||'').trim(),split=e.split||'half';
  if(!(amt>0)||!Number.isFinite(amt))continue;
  if(!['自分','友人'].includes(payer)||!['half','self','friend'].includes(split)){unknown++;continue}
  const share=split==='self'?amt:split==='friend'?0:amt/2;
  selfShare+=share;friendShare+=amt-share;
  if(payer==='自分')selfPaid+=amt;else friendPaid+=amt;
 }
 const round=x=>Math.round(x*100)/100;
 return {selfPaid:round(selfPaid),friendPaid:round(friendPaid),selfShare:round(selfShare),friendShare:round(friendShare),balance:round(selfPaid-selfShare),unknown};
}

 try{

  const reg=await navigator.serviceWorker.getRegistration('./');if(!reg)throw Error('PWAの登録がありません。オンラインでアプリを開き直してください');
  const keys=(await caches.keys()).filter(k=>k.startsWith('shanghai-tabi-techo-pwa-')).sort((a,b)=>Number(b.split('-v').pop())-Number(a.split('-v').pop()));

  if(saveNow){for(const p of paths){const res=await fetch(p,{cache:'reload'});if(!res.ok)throw Error('取得失敗 '+p);await cache.put(p,res)}}
  const checks=await Promise.all(paths.map(p=>cache.match(p))),count=checks.filter(Boolean).length;

 const flights=confirmedFlights.slice(),draft=get('rail-booking');
 if(draft&&draft.status==='予約済み'&&validYmd(draft.date||'')&&draft.date===sharedRailMemo.date){
  for(const [key,title] of [['out','🚄 往路・上海 → 無錫'],['back','🚄 復路・無錫 → 上海']]){

   if(/^([01]\d|2[0-3]):[0-5]\d$/.test(String(val||''))&&String(num||'').trim()){
    flights.push({id:key+'Rail',name:title+'｜'+num,iso:draft.date+'T'+val+':00+08:00',local:draft.date+' '+val+'（中国時間）',type:'端末の予約済み下書き・発車時刻の再確認が必要'});

function countdownText(target,nowMs=Date.now()){
 const remaining=Date.parse(target)-nowMs;if(!Number.isFinite(remaining))return '時刻を確認してください';
 if(remaining<=0)return '出発時刻を過ぎました';
 const minutes=Math.ceil(remaining/60000);
 const d=Math.floor(minutes/1440),h=Math.floor((minutes%1440)/60),m=minutes%60;
 return (d?d+'日 ':'')+(d||h?h+'時間 ':'')+m+'分';
}

 '<div class="spend-bar-label"><span>消化率（計画下限 '+fmtAmount(low)+' 元に対して）</span><strong>'+pct.toFixed(1)+'%</strong></div>'+
 '<div class="spend-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+Math.round(progress)+'" aria-label="予算消化率"><span style="width:'+progress.toFixed(1)+'%"></span></div>'+
 (pct>100?'<p class="hint">記録済み支出が予算下限を超えています。</p>':'')+
 '<p class="tiny-hint">未入力の支出は含みません。2人で同じ支出を重複入力すると実績は過大になります。支出した合計金額を1件として登録してください。記録済みの支出に航空券・宿泊費が含まれる場合は比較対象が異なります。</p>');

/* Travel assistant: progress, visits, cash planning and boarding preparations. All personal state remains on-device. */
function tripProgress(){const x=get('trip-progress');return x&&typeof x==='object'&&!Array.isArray(x)?x:{}}
function progressKey(i,j){return ((i===0||i===2)?yuyuanPlanMode:'shared')+'-'+i+'-'+j}
function statusLabel(v){return v==='done'?'完了':v==='skip'?'スキップ':'未完了'}
function progressSummary(i){const es=yuyuanEvents(i),state=tripProgress(),values=es.map((e,j)=>state[progressKey(i,j)]||'todo');return {total:es.length,done:values.filter(v=>v==='done').length,skip:values.filter(v=>v==='skip').length}}
function itineraryProgressPanel(i){
 const sum=progressSummary(i),es=yuyuanEvents(i),state=tripProgress();
 const nowDate=localTripDate(currentTrip()),clock=eventTime(localTripTime(currentTrip()));
 const isToday=nowDate===itineraryDates(currentTrip())[i];
 let next=es.findIndex((e,j)=>state[progressKey(i,j)]!=='done'&&state[progressKey(i,j)]!=='skip');
 let advisory='';
 if(isToday&&next>=0){const start=eventTime(es[next][0]);if(start!==null&&clock-start>20)advisory='<p class="hint">予定開始から'+(clock-start)+'分経過。残りの行程を確認してください。無錫では三鳳橋を先に省略、12/30の豫園は入園時刻に注意してください。時刻は中国時間の端末時計に基づく目安です。</p>';}
 if(isToday&&i===0&&yuyuanPlanMode==='normal'&&clock>=15*60+45&&state[progressKey(0,3)]!=='done')advisory+='<p class="hint">豫園入園が厳しい場合は、上の「予備：1/1入園」で切り替えられます。実際の開園・入場状況を優先してください。</p>';
 return panel('<h2>✅ 旅程の進行管理</h2><p>完了 '+sum.done+' / '+sum.total+' 件・スキップ '+sum.skip+' 件。記録はこの端末だけに保存されます。</p>'+advisory+es.map((e,j)=>'<div class="card"><span class="time">'+esc(e[0])+'</span><strong>'+esc(e[1])+'</strong><div class="segment"><button type="button" data-step="'+i+'-'+j+'" data-status="todo" class="'+(!(state[progressKey(i,j)]==='done'||state[progressKey(i,j)]==='skip')?'active':'')+'">未完了</button><button type="button" data-step="'+i+'-'+j+'" data-status="done" class="'+(state[progressKey(i,j)]==='done'?'active':'')+'">完了</button><button type="button" data-step="'+i+'-'+j+'" data-status="skip" class="'+(state[progressKey(i,j)]==='skip'?'active':'')+'">スキップ</button></div></div>').join(''));
}

const expense=document.getElementById('expenseForm');if(expense)expense.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(expense).entries()),amount=Number(d.amount);if(!Number.isFinite(amount)||amount<=0||amount>99999999||!validYmd(d.date))return;const arr=tripExpenses();arr.push({...d,id:'expense-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),amount:Math.round(amount*100)/100});set('expenses-'+selectedTrip(),arr);render()};
document.querySelectorAll('[data-expense-delete]').forEach(n=>n.onclick=()=>{if(confirm('支出を削除しますか？')){set('expenses-'+selectedTrip(),tripExpenses().filter(e=>e.id!==n.dataset.expenseDelete));render()}});
const expBtn=document.getElementById('backupExport');if(expBtn)expBtn.onclick=()=>{try{exportBackup()}catch(err){document.getElementById('backupStatus').textContent='出力に失敗しました：'+err.message}};
const impBtn=document.getElementById('backupImport');if(impBtn)impBtn.onclick=async()=>{const f=document.getElementById('backupFile').files[0];const msg=document.getElementById('backupStatus');try{const ok=await importBackup(f);msg.textContent=ok?'復元しました。画面を再読み込みします。':'復元を取り消しました。';if(ok)render()}catch(err){msg.textContent='復元できません：'+err.message}};
const ver=document.getElementById('appUpdateCheck');if(ver)ver.onclick=checkAppVersion;

document.querySelectorAll('[data-day]').forEach(n=>n.onclick=()=>{day=+n.dataset.day;render()});document.querySelectorAll('[data-step]').forEach(n=>n.onclick=()=>{const state=tripProgress();state[n.dataset.step]=n.dataset.status;set('trip-progress',state);render()});document.querySelectorAll('[data-visit]').forEach(n=>n.onclick=()=>{const state=visitLog(),old=state[n.dataset.visit]||{};state[n.dataset.visit]={...old,done:!old.done,at:!old.done?new Date().toISOString():''};set('visit-log',state);render()});document.querySelectorAll('[data-visit-note]').forEach(n=>n.onchange=()=>{const state=visitLog(),old=state[n.dataset.visitNote]||{};state[n.dataset.visitNote]={...old,note:n.value.slice(0,160)};set('visit-log',state)});const skipSanfengqiao=document.getElementById('skipSanfengqiao');if(skipSanfengqiao)skipSanfengqiao.onchange=()=>{set('wuxi-options',{skipSanfengqiao:skipSanfengqiao.checked});render()};document.querySelectorAll('[data-yuyuan-mode]').forEach(n=>n.onclick=()=>{yuyuanPlanMode=n.dataset.yuyuanMode;set('yuyuan-plan',{mode:yuyuanPlanMode});render()});document.querySelectorAll('[data-pack],[data-food],[data-gifts]').forEach(n=>n.onchange=()=>{let type=n.dataset.pack?'packing':n.dataset.food?'food':'gifts',key=n.dataset.pack||n.dataset.food||n.dataset.gifts,s=get(type);s[key]=n.checked;set(type,s);render()});let reset=document.getElementById('resetPacking');if(reset)reset.onclick=()=>{if(confirm('持ち物のチェックをすべて解除しますか？')){set('packing',{});render()}};let share=document.getElementById('share');if(share)share.onclick=async()=>{if(navigator.share)try{await navigator.share({title:'上海旅手帖',url:location.href});return}catch{}try{await navigator.clipboard.writeText(location.href);alert('URLをコピーしました')}catch{prompt('このURLをコピーしてください',location.href)}};if(typeof compactEnhance==='function')compactEnhance();}
try{const restore=sessionStorage.getItem('shanghai-update-page');if(restore&&navItems.some(x=>x[0]===restore)){page=restore;day=Number(sessionStorage.getItem('shanghai-update-day'))||0}sessionStorage.removeItem('shanghai-update-page');sessionStorage.removeItem('shanghai-update-day')}catch{}
// Render after the external compact UI module is parsed. Never render before its functions exist.
document.addEventListener('DOMContentLoaded',()=>{try{render()}catch(err){console.error('Initial render failed',err);const el=document.getElementById('content');if(el)el.innerHTML='<section class="panel"><h2>表示を復旧しています</h2><p>読み込みが途中で止まりました。画面を再読み込みしてください。入力済みデータは削除されません。</p><button type="button" class="ghost" onclick="location.reload()">再読み込み</button></section>'; }},{once:true});
setInterval(()=>{if(!document.hidden)refreshCountdownNodes()},30000);
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const modal=document.getElementById('chineseShowOverlay');if(modal)modal.remove()}});
const updateNowButton=document.getElementById('updateNow');if(updateNowButton)updateNowButton.addEventListener('click',updateAppNow);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('オフライン機能の登録に失敗しました',err));});}

/* Embedded six-tab navigation: no external JS required for startup. */
/* Compact UI experiment v2.6: no itinerary data migrations. */
const compactBottomNav=navItems; // v2.9: restore all 13 direct-access tabs; horizontal swipe is supported
const compactMenuGroups=[
 ['旅の準備',[['bookings','🎫','予約・航空便'],['packing','🧳','持ち物'],['tools','🧰','便利ツール']]],
 ['観光・現地',[['food','🥟','グルメ'],['more','🪭','お土産'],['phrase','🀄','中国語・翻訳'],['knowledge','🇨🇳','中国豆知識'],['safety','🆘','緊急連絡']]],
 ['記録・設定',[['expenses','🧾','支出・精算'],['manage','⚙️','旅行管理']]]
];

/* v2.7: six one-tap destinations; context-specific shortcuts preserve all 13 original functions. */
function directShortcuts(items){
 return '<div class="direct-shortcuts">'+items.map(([name,target,anchor,emoji])=>'<button type="button" class="direct-shortcut" data-direct-page="'+esc(target)+'"'+(anchor?' data-direct-anchor="'+esc(anchor)+'"':'')+'><span aria-hidden="true">'+esc(emoji)+'</span><strong>'+esc(name)+'</strong></button>').join('')+'</div>';
}
function homeShortcutPanel(){
 return panel('<h2>よく使う機能</h2><p class="muted">必要な機能へ直接移動できます。</p>'+directShortcuts([
 ['持ち物','packing','','🧳'],['入国・旅行情報','knowledge','','🇨🇳'],['天気予報','tools','天気予報','🌦️'],['乗車準備','bookings','','🚄'],
 ['旅程PDF','tools','旅程PDF','📄'],['予約確認','bookings','','🎫'],['支出記録','budget','支出','🧾'],['タクシー','tools','タクシー','🚕'],['検索・全機能','menu','','🔎']
 ]));
}
function scheduleShortcutPanel(){
 return panel('<h2>日程に関連する機能</h2>'+directShortcuts([['予約・高鉄','bookings','','🎫'],['タクシー','tools','タクシー','🚕'],['天気','tools','天気予報','🌦️'],['旅程PDF','tools','旅程PDF','📄']]));
}
function phraseShortcutPanel(){return panel('<h2>現地で使う中国語</h2>'+directShortcuts([['タクシー用中国語','tools','タクシー','🚕']]));}
function unifiedMoneyPanel(){
 const mode=get('money-view').tab==='expenses'?'expenses':'plan';
 return panel('<h2>💴 旅行のお金</h2><div class="segment money-switch"><button type="button" data-money-tab="plan" class="'+(mode==='plan'?'active':'')+'">🧧 予算・残額</button><button type="button" data-money-tab="expenses" class="'+(mode==='expenses'?'active':'')+'">🧾 支出・精算</button></div>')+(mode==='plan'?(selectedTrip()===MAIN_TRIP?budgetAssistantPanel()+spendingOverview()+budgetPanel():spendingOverview()):spendingOverview()+expensePanel()+splitPanel());
}
function directGo(pageId,anchor){
 if(pageId==='budget'&&anchor==='支出')set('money-view',{tab:'expenses'});
 jump(pageId);
 if(anchor&&!(pageId==='budget'&&anchor==='支出')){
  const sections=[...document.querySelectorAll('#content section.panel, #content details.compact-accordion')];
  const match=sections.find(el=>{
   const title=el.querySelector(':scope > h2,:scope > summary');return title&&title.textContent.includes(anchor);
  });
  if(match){
   if(match.tagName==='DETAILS')match.open=true;
   match.scrollIntoView({behavior:'smooth',block:'start'});
  }
 }
}
function compactPinnedActions(){
 let root=document.getElementById('compactPinnedActions');
 if(root)return;
 root=document.createElement('div');root.id='compactPinnedActions';
 root.innerHTML='<button type="button" data-pin-go="safety" aria-label="緊急連絡先を開く">🆘 <span>緊急</span></button><button type="button" data-pin-go="manage" aria-label="設定と旅行管理を開く">⚙️ <span>設定</span></button>';
 document.body.appendChild(root);
 root.querySelectorAll('[data-pin-go]').forEach(b=>b.onclick=()=>jump(b.dataset.pinGo));
}

function compactMenuPanel(){
 return panel('<h2>🔎 アプリ内検索</h2><label for="compactSearch">旅程・観光・飲食・お土産・中国語を探す</label><input type="search" id="compactSearch" placeholder="例：豫園、無錫、ホテル、小籠包" autocomplete="off"><div id="compactSearchResults" role="status"></div><p class="tiny-hint">検索は端末内の登録情報を対象にしています。公開サイトや地図全体を検索するものではありません。</p>')+
 compactMenuGroups.map(([heading,links])=>panel('<h2>'+heading+'</h2><div class="compact-menu-grid">'+links.map(([id,icon,name])=>'<button class="ghost compact-menu-item" data-compact-go="'+id+'"><span aria-hidden="true">'+icon+'</span><strong>'+name+'</strong> <span aria-hidden="true">›</span></button>').join('')+'</div>')).join('');
}
function compactMapPanel(){
 const points=[['ホテル',hotel.zh+' '+hotel.address],['豫園','豫园 上海'],['上海書城','上海书城 福州路465号'],['外灘','外滩 上海'],['上海タワー','上海中心大厦 上海'],['上海駅','上海火车站 上海'],['無錫駅','无锡站 无锡'],['恵山古鎮','惠山古镇 无锡'],['寄暢園','寄畅园 无锡'],['南長街','南长街 无锡']];
 return panel('<h2>📍 目的地ショートカット</h2><p class="muted">地図を開く、または現在地からルートを検索できます。中国国内では高徳地図が便利です。</p>'+points.map(([name,query])=>'<div class="card compact-map-point"><strong>'+esc(name)+'</strong>'+mapPickButton(query,'地図で確認')+'</div>').join(''));
}
function compactCatalog(){
 const all=[];
 const add=(page,name,detail)=>{if(name&&typeof name==='string')all.push({page,name,detail:String(detail||'')})};
 days.forEach((d,i)=>yuyuanEvents(i).forEach(e=>add('schedule',e[1],d.date+' '+(e[2]||''))));
 if(typeof foodDetails!=='undefined')foodDetails.forEach(e=>add('food',e[0],e[1]+' '+e[2]));
 if(typeof extraFoodDetails!=='undefined')extraFoodDetails.forEach(e=>add('food',e[0],e[1]+' '+e[2]));
 if(typeof giftDetails!=='undefined')giftDetails.forEach(e=>add('more',e[0],e[1]+' '+e[2]));
 if(typeof extraGiftDetails!=='undefined')extraGiftDetails.forEach(e=>add('more',e[0],e[1]+' '+e[2]));
 if(typeof phraseGroups!=='undefined')phraseGroups.forEach(group=>group[1].forEach(e=>add('phrase',e[2],e[0]+' '+e[1])));
 add('map','ホテル',hotel.zh+' '+hotel.address);
 add('tools','タクシー用中国語','ホテル 目的地 住所');
 add('tools','天気予報','上海 無錫');
 add('tools','旅程PDF','旅程 保存 印刷');
 return all;
}
function compactSearch(query){
 const q=String(query).normalize('NFKC').trim().toLocaleLowerCase();
 if(!q)return [];
 return compactCatalog().filter(x=>(x.name+' '+x.detail).normalize('NFKC').toLocaleLowerCase().includes(q)).slice(0,25);
}
function compactRenderResults(query){
 const box=document.getElementById('compactSearchResults');if(!box)return;
 const results=compactSearch(query);
 if(!query.trim()){box.innerHTML='';return}
 box.innerHTML=results.length?results.map((r,i)=>'<button class="ghost compact-search-hit" data-compact-result="'+i+'"><strong>'+esc(r.name)+'</strong><small>'+esc(({schedule:'日程',food:'グルメ',more:'お土産',phrase:'中国語',map:'地図',tools:'便利'}[r.page]||r.page))+'</small></button>').join(''):'<p class="muted">一致する項目がありません。</p>';
 box.querySelectorAll('[data-compact-result]').forEach(b=>b.onclick=()=>{
  const item=results[Number(b.dataset.compactResult)];if(!item)return;
  if(item.page==='schedule'){const idx=days.findIndex((d,i)=>yuyuanEvents(i).some(e=>e[1]===item.name));if(idx>=0)day=idx}
  jump(item.page);
  // Search the rendered text, not an external search provider.
  const targets=[...document.querySelectorAll('#content .card,#content .panel')];
  const match=targets.find(el=>el.textContent.includes(item.name));if(match){let parent=match.closest('details');if(parent)parent.open=true;match.scrollIntoView({behavior:'smooth',block:'center'});}
 });
}
function compactEnhance(){
 const container=document.getElementById('content');if(!container)return;
 document.querySelectorAll('[data-compact-go]').forEach(b=>b.onclick=()=>jump(b.dataset.compactGo));
 const search=document.getElementById('compactSearch');if(search)search.oninput=()=>compactRenderResults(search.value);
 const nav=document.getElementById('nav');if(nav)nav.setAttribute('aria-label','主要メニュー');
 const top=document.getElementById('compactToTop');if(top)top.hidden=window.scrollY<450;
 document.querySelectorAll('[data-direct-page]').forEach(b=>b.onclick=()=>directGo(b.dataset.directPage,b.dataset.directAnchor||''));
 document.querySelectorAll('[data-money-tab]').forEach(b=>b.onclick=()=>{set('money-view',{tab:b.dataset.moneyTab});render()});
 const collapsiblePages=['home','schedule','food','more','knowledge','tools','budget','manage','phrase','packing','bookings','expenses'];
 if(collapsiblePages.includes(page)){
  [...container.querySelectorAll(':scope > section.panel')].forEach((section,i)=>{
   const head=section.querySelector(':scope > h2');
   if(!head)return;
   const heading=head.textContent.trim();
   const keep=(page==='home'&&i<=1)||(page==='schedule'&&heading==='日別スケジュール')||
      (page==='budget'&&i===0)||(page==='phrase'&&i===0)||
      ((page==='food'||page==='more'||page==='knowledge')&&i===0)||
      (page==='expenses'&&i===0)||
      (page==='packing'&&i===0)||(page==='bookings'&&i===0);
   if(keep)return;
   const details=document.createElement('details');details.className='compact-accordion panel';
   const stateKey=page+':'+(page==='schedule'?day+':':'')+i+':'+heading;
   if(expandedSectionState[stateKey]===true)details.open=true;
   details.addEventListener('toggle',()=>{expandedSectionState[stateKey]=details.open});
   const summary=document.createElement('summary');summary.textContent=heading;summary.setAttribute('aria-label',heading+'（タップして開閉）');details.appendChild(summary);
   head.remove();while(section.firstChild)details.appendChild(section.firstChild);
   section.replaceWith(details);
  });
 }
 // For long food/souvenir listings, each place starts as a compact one-line card.
 if(page==='food'||page==='more'){
  container.querySelectorAll('.detail-no-checkbox').forEach(card=>{
   card.classList.add('vertical-compact-item');
   card.setAttribute('tabindex','0');
   card.setAttribute('role','button');
   card.setAttribute('aria-expanded','false');
   const toggle=()=>{const show=card.classList.toggle('expanded');card.setAttribute('aria-expanded',show?'true':'false')};
   card.addEventListener('click',e=>{if(!e.target.closest('button,a,input'))toggle()});
   card.addEventListener('keydown',e=>{if(e.target===card&&(e.key==='Enter'||e.key===' ')){e.preventDefault();toggle()}});
  });
 }
 // Tables inside accordions must not inherit width:100% plus 28px outside margins.
 // Wrap each table in its own scroll container so all amounts remain accessible.
 container.querySelectorAll('table').forEach(table=>{
  if(table.closest('.responsive-table-scroll'))return;
  const wrapper=document.createElement('div');
  wrapper.className='responsive-table-scroll';
  wrapper.setAttribute('role','region');
  wrapper.setAttribute('aria-label',table.classList.contains('money-table')?'予算の内訳表':'詳細一覧表');
  wrapper.setAttribute('tabindex','0');
  table.parentNode.insertBefore(wrapper,table);
  wrapper.appendChild(table);
 });
 if(page==='schedule'){
  // Keep the itinerary switcher visible without hiding the scheduled stops.
  let host=[...container.querySelectorAll('section.panel')].find(el=>el.querySelector(':scope > h2')?.textContent.includes('日別スケジュール'));
  if(host){
   const controls=document.createElement('div');controls.className='compact-view-control';
   const current=get('compact-view').value==='detail'?'detail':'compact';
   controls.innerHTML='<strong>旅程の表示</strong><button type="button" data-compact-view="compact" class="'+(current==='compact'?'active':'')+'">簡易</button><button type="button" data-compact-view="detail" class="'+(current==='detail'?'active':'')+'">詳細</button>';
   host.querySelector('h2').insertAdjacentElement('afterend',controls);
   host.classList.toggle('itinerary-compact',current==='compact');
   host.querySelectorAll(':scope > .card').forEach(el=>{
    if(el.querySelector('span.time')){el.classList.add('compact-event');el.addEventListener('click',e=>{if(e.target.closest('button,a,input'))return;if(host.classList.contains('itinerary-compact'))el.classList.toggle('expanded')})}
   });
   controls.querySelectorAll('[data-compact-view]').forEach(b=>b.onclick=()=>{set('compact-view',{value:b.dataset.compactView});render()});
  }
 }
}
function compactTopButtonSetup(){
 if(document.getElementById('compactToTop'))return;
 const button=document.createElement('button');button.id='compactToTop';button.type='button';button.textContent='↑';button.setAttribute('aria-label','ページの先頭へ戻る');button.hidden=true;
 button.onclick=()=>window.scrollTo({top:0,behavior:'smooth'});document.body.appendChild(button);
 const update=()=>{button.hidden=window.scrollY<450};window.addEventListener('scroll',update,{passive:true});update();
}
// Initial page rendering is triggered once by index.html on DOMContentLoaded.
// This module only provides helpers; avoid rendering twice during startup.
compactTopButtonSetup();
