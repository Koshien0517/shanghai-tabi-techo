let phraseCategory='🚕 ホテルへ行く・タクシー',phraseFavoritesOnly=false;
function phrasebookPanel(){
 const fav=get('phrase-favorites');const groups=['⭐ お気に入り','🔎 全フレーズ',...phraseGroups.map(x=>x[0])];const selected=phraseCategory;
 let entries= selected==='⭐ お気に入り' ? phraseGroups.flatMap(([category,items])=>items.map(item=>[...item,category])).filter(item=>fav[item[0]]) : selected==='🔎 全フレーズ' ? phraseGroups.flatMap(([category,items])=>items.map(item=>[...item,category])) : (phraseGroups.find(x=>x[0]===selected)||phraseGroups[0])[1].map(item=>[...item,selected]);
 if(phraseFavoritesOnly)entries=entries.filter(x=>fav[x[0]]);
 return panel('<span class="tag">中国語 · 旅行会話</span><h2 style="margin-top:12px">🗣️ 旅先ですぐ見せる中国語</h2><p class="intro">簡体字・ピンイン・日本語訳をセットで表示。中国語をコピーして店員さんや駅員さんに見せることもできます。</p><p class="hint">食事：同行者は辛い料理が基本NG。あなたは少し辛くてもOK。2人とも魚・羊肉は控えめに。点心・チャーハン・餃子は上海滞在中に食べる必須メニューです。</p><div class="phrase-cats">'+groups.map(x=>`<button class="phrase-tab ${x===selected?'active':''}" data-phrase-cat="${esc(x)}" aria-pressed="${x===selected}">${esc(x)}</button>`).join('')+'</div><div class="phrase-tools"><input type="search" id="phraseSearch" placeholder="選択中のカテゴリを検索（全件は🔎 全フレーズ）" aria-label="会話フレーズ検索"><button id="phraseFavToggle" class="ghost" aria-pressed="'+phraseFavoritesOnly+'">'+(phraseFavoritesOnly?'★ お気に入りのみ':'☆ お気に入りのみ')+'</button></div><p class="muted">'+entries.length+'フレーズ · ☆でお気に入り保存（端末ごと）</p><div id="phraseList">'+(entries.length?entries.map(([zh,pinyin,ja,cat])=>`<article class="phrase-card" data-search="${esc((zh+' '+pinyin+' '+ja).toLowerCase())}"><div class="phrase-header"><span class="phrase-zh" lang="zh-CN">${esc(zh)}</span><button class="phrase-star" aria-label="お気に入り切替：${esc(ja)}" data-phrase-fav="${esc(zh)}">${fav[zh]?'★':'☆'}</button></div><div class="phrase-pinyin">${esc(pinyin)}</div><p class="phrase-ja">${esc(ja)}</p><button class="copy-btn" data-phrase-copy="${esc(zh)}">📋 中国語をコピー</button></article>`).join(''):'<p class="muted">お気に入りはまだありません。各フレーズの☆から追加できます。</p>')+'</div><p id="phraseNothing" class="muted hidden">該当するフレーズがありません。</p>')
}

function fmt(n){return Math.round(n).toLocaleString('ja-JP')}

function mapPickButton(query,label){return '<button type="button" class="maps map-choice" data-map="'+esc(query)+'">🗺️ '+esc(label||'地図アプリを選ぶ')+' ↗</button>'}
function detailCards(items,stateKey){const state=get(stateKey);return items.map(([name,zh,desc,where,meta])=>'<div class="card"><label class="checkrow"><input type="checkbox" data-'+stateKey+'="'+esc(name)+'" '+(state[name]?'checked':'')+'><span><strong>'+esc(name)+'</strong><span class="muted">'+esc(zh)+'</span></span></label><p>'+esc(desc)+'</p><p class="muted">📍 '+esc(where)+' ／ '+esc(meta)+(stateKey==='food'?'（価格は参考目安）':'')+'</p>'+mapPickButton(where,'候補のお店・場所を探す')+'</div>').join('')}

function budgetPanel(){
  const r=routes.find(x=>x.id===budgetMode)||routes[0];
  const total=budget.reduce((sum,row)=>sum+row[1],0);
  const adjusted=total-60+r.yuan;
  const trip=railCandidates.find(x=>x.id===railChoice)||railCandidates[0];
  const extras=[trip.rail[0]+trip.local[0],trip.rail[1]+trip.local[1]];
  const rate=yenMode==='card'?exchangeRate*1.03:exchangeRate;
  const low=adjusted+extras[0],high=adjusted+extras[1];
  const toYen=n=>fmt(n*rate)+'円';
  const est=extras[0]===extras[1] ? fmt(low)+'元' : fmt(low)+'〜'+fmt(high)+'元';
  const yen1=extras[0]===extras[1] ? toYen(low) : toYen(low)+'〜'+toYen(high);
  const yen2=extras[0]===extras[1] ? toYen(2*low) : toYen(2*low)+'〜'+toYen(2*high);
  const core=panel('<p class="budget-section-label">A｜上海滞在の基本予算</p><h2>💴 基本現地予算</h2><p class="muted">航空券・宿泊代と12/31の高速鉄道日帰り費用は含みません。友人にも公開する共通の計画額です。</p><div class="budget-total"><small>標準予算・1人／3泊4日</small><strong>1,665元</strong><b>約39,960円</b><br><br><small>2人合計</small><strong>3,330元</strong><b>約79,920円</b></div><p class="muted">基準レート1元＝24円で換算した金額（決済時の手数料は別）。往路はリニア＋地下鉄60元／人を仮置きしています。</p>')
  +panel('<h2>基本予算の内訳（1人）</h2><table class="money-table"><thead><tr><th>費目</th><th>人民元</th><th>日本円</th></tr></thead><tbody>'+budget.map(([name,v])=>`<tr><td>${esc(name)}</td><td>${fmt(v)}元</td><td>${fmt(v*exchangeRate)}円</td></tr>`).join('')+`</tbody><tfoot><tr><td>合計</td><td>${fmt(total)}元</td><td>${fmt(total*exchangeRate)}円</td></tr></tfoot></table><p class="tiny-hint">現地の食事・買い物・観光・市内交通を含む。12/31を遠方に変更する場合、食費や入場料の追加差額が生じる可能性があります。</p>`)
  +panel('<h2>12/30 往路・交通費の比較</h2><p class="muted">往路3案は未決定。ここでの切替は試算のみです。</p>'+routes.map(x=>`<button class="choice ${budgetMode===x.id?'selected':''}" data-route="${x.id}" aria-pressed="${budgetMode===x.id}"><strong>${esc(x.title)}</strong><span>${esc(x.price)}・${esc(x.time)}</span></button>`).join('')+`<div class="breakdown">選択時の基本予算（1人）：<strong>${fmt(adjusted)}元（約${fmt(adjusted*exchangeRate)}円）</strong><br>2人合計：約${fmt(adjusted*exchangeRate*2)}円</div><p class="tiny-hint">標準予算の往路60元を選択ルートの費用で置換。タクシーは1台205元を2人で折半（102.5元／人）。実額は1台160〜250元想定。</p>`);
  const rail=panel('<p class="budget-section-label">B｜12月31日・高速鉄道日帰りの別枠</p><h2>🚄 日帰り候補地を比較</h2><p class="hint"><strong>12月31日の現行旅程は上海市内。</strong> 高速鉄道日帰りは未決定の代替案です。現行旅程を自動で変更しません。</p>'+railCandidates.map(x=>`<button class="choice ${railChoice===x.id?'selected':''}" data-rail="${x.id}" aria-pressed="${railChoice===x.id}"><strong>${esc(x.title)} ${x.pinyin?`<span class="muted">(${esc(x.pinyin)})</span>`:''}</strong><span>${esc(x.desc)}</span>${x.id==='none'?'':`<span class="muted">高速鉄道往復（二等座）${fmt(x.rail[0])}〜${fmt(x.rail[1])}元／人、追加交通費${fmt(x.local[0])}〜${fmt(x.local[1])}元／人</span>`}</button>`).join('')+`<div class="budget-total secondary"><small>選択候補の別枠追加額（1人）</small><strong>${extras[0]===extras[1]?fmt(extras[0]):fmt(extras[0])+'〜'+fmt(extras[1])}元</strong><b>約${extras[0]===extras[1]?fmt(extras[0]*exchangeRate):fmt(extras[0]*exchangeRate)+'〜'+fmt(extras[1]*exchangeRate)}円（基準換算）</b></div><p class="cost-note">高速鉄道往復＋候補地での追加交通費を計上。食事・飲み物は基本予算に計上済みで二重計上しません。入場料差額や追加の上海駅アクセス費が必要なら別途加算。</p><div class="breakdown"><strong>参考上限：</strong>日帰り別枠は1人最大20,000円を計画上の上限目安とします（上限を保証するものではありません）。高速鉄道の正式料金・発売列車は12306等で確認してください。</div>`);
  const payment=panel(`<p class="budget-section-label">C｜Alipay・WeChat Payと日本円換算</p><h2>💳 現地の決済方法</h2><p>基本は<strong>Alipay（支付宝）／WeChat Pay（微信支付）</strong>。日本発行のクレジットカードを登録して決済する想定です。</p><div class="rate-grid"><div class="data-box"><small>予算用の基準レート</small><b>1元＝24.00円</b></div><div class="data-box"><small>カード手数料3%仮定</small><b>1元＝24.72円</b></div></div><p class="cost-note">24円は旅行計画の仮定レートであり、リアルタイム為替ではありません。カード会社の海外事務処理手数料を仮に3%とし、24×1.03＝24.72円で試算。実際のカードによって料率は異なります。</p><div class="breakdown">海外発行カードを利用する場合、決済アプリ側の追加手数料が発生する取引があります。<strong>1回200元以下は通常追加手数料なし、200元超は3%が原則</strong>という条件を目安としていますが、適用条件・キャンペーンで変わります。これはカード会社の手数料と別です。</div><p class="cost-note">実際にどの会計が200元を超えるか未確定のため、アプリ側の追加手数料は下記総額には含めていません。店や交通機関がカード連携決済に対応するかも事前に確認してください。</p><h3>総予算の日本円換算</h3><button class="pill-control" data-yen="base" aria-pressed="${yenMode==='base'}">為替のみ：1元＝24.00円</button><button class="pill-control" data-yen="card" aria-pressed="${yenMode==='card'}">カード手数料3%を仮定：1元＝24.72円</button><div class="budget-total"><small>基本現地予算（選択中の往路）＋12/31別枠</small><strong>${est}</strong><b>1人：約${yen1}</b><p class="small">2人合計：約${yen2}</p></div><p class="tiny-hint">選択状態はこの画面での試算専用。往路も12/31日帰り候補も確定しません。決済アプリ側の追加手数料、入場料差額、キャンペーン・為替変動は別。</p>`);
  return core+rail+payment+panel('<h2>予算の目安</h2><div class="data-grid"><div class="data-box"><small>節約型／1人</small><b>約25,000円</b></div><div class="data-box"><small>標準型／1人</small><b>約40,000円</b></div><div class="data-box"><small>余裕型／1人</small><b>約55,000円</b></div><div class="data-box"><small>マッサージ</small><b>別途追加</b></div></div><p class="muted">いずれも高速鉄道の日帰り費用を含まない参考額です。運賃・料金は未予約の概算です。</p>');
}

function render(){document.body.className='page-'+page;document.getElementById('nav').classList.add('nav-6');document.getElementById('nav').innerHTML=navItems.map(([id,emoji,title])=>`<button aria-label="${title}" class="${page===id?'active':''}" data-page="${id}"><span>${emoji}</span>${title}</button>`).join('');document.querySelectorAll('[data-page]').forEach(n=>n.onclick=()=>jump(n.dataset.page));let html='';
if(page==='home'){html=panel('<span class="tag">友人との上海旅行</span><h2 style="margin-top:12px">旅のしおり</h2><p class="intro">豫園の路地、上海の近代史、外灘の夜景。4日間の旅程と準備をこのページにまとめました。</p><p><strong>往路：</strong>12/30 JL891 関空 10:15 → 上海浦東 12:05（現地時刻）</p><p><strong>復路：</strong>1/2 JL894 上海浦東 13:25 → 関空 16:45（日本時刻）</p>')+hotelPanel()+panel('<h2>4日間の見どころ</h2>'+days.map((d,i)=>`<div class="card"><span class="time">DAY ${i+1} · ${d.date}</span><strong>${d.name}</strong></div>`).join('')+'<button class="ghost" onclick="jump(\'schedule\')">詳しい旅程を見る →</button>')+panel('<h2>旅の準備・予算</h2><p class="intro">旅行準備の持ち物と、現地概算予算と12月31日の高速鉄道日帰り候補を別枠で比較できます。</p><button class="ghost" onclick="jump(\'packing\')">持ち物チェックリストへ →</button>　<button class="ghost" onclick="jump(\'budget\')">現地予算を見る →</button><p style="margin-top:15px"><button class="ghost" onclick="jump(\'knowledge\')">🛂 入国カードの書き方・中国旅行ガイド →</button></p>');}
if(page==='schedule'){html=panel('<h2>日別スケジュール</h2><div class="segment">'+days.map((d,i)=>`<button class="${i===day?'active':''}" data-day="${i}">${d.date}</button>`).join('')+'</div><h3>'+days[day].name+'</h3>'+days[day].events.map(e=>`<div class="card"><span class="time">${esc(e[0])}</span><strong>${esc(e[1])}</strong>${e[2]?`<p class="muted">${esc(e[2])}</p>`:''}${e[3]?`${mapPickButton(e[3],'地図アプリを選ぶ')}`:''}</div>`).join(''))+(day===0?hotelPanel()+transitPanel():day===1?railBookingPanel():day===3?returnPanel():'')+panel('<div class="hint">年末年始の施設開館・予約・入場制限、12/31の外灘の通行規制は直前に確認してください。記載時刻は計画であり予約確定ではありません。</div>');}
if(page==='packing'){let state=get('packing');let total=categories.flatMap(x=>x[1]).length;let done=categories.flatMap(x=>x[1]).filter(x=>state[x]).length;html=panel(`<div class="groupHead"><h2>持ち物チェック</h2><span class="tag">${done} / ${total} 準備済み</span></div><div class="progress" role="progressbar" aria-valuenow="${done}" aria-valuemax="${total}"><div class="fill" style="width:${done/total*100}%"></div></div><p class="muted">準備率 ${Math.round(done/total*100)}%</p><p class="muted">チェックはこの端末のブラウザ内に保存されます。友人のチェックとは連動しません。</p>`)+categories.map(([title,items])=>panel(`<div class="groupHead"><h2>${title}</h2><span class="muted">${items.filter(x=>state[x]).length}/${items.length}</span></div>`+items.map(x=>`<label class="checkrow"><input type="checkbox" data-pack="${esc(x)}" ${state[x]?'checked':''}><span class="${state[x]?'checked':''}">${esc(x)}</span></label>`).join(''))).join('')+panel('<button class="ghost" id="resetPacking">すべてのチェックを解除</button>');}
if(page==='food'){html=panel('<h2>🥟 上海グルメガイド</h2><p class="muted">料理名（中国語）・特徴・探すエリア・予算目安を掲載。チェック状態は端末別です。</p>')+panel('<div class="hint">辛さを控えたいとき：请不要放辣椒（Qǐng bú yào fàng làjiāo）＝唐辛子を入れないでください。記載価格は概算で店舗によって異なります。</div>')+panel(detailCards(foodDetails,'food'));}
if(page==='budget'){html=budgetPanel();}
if(page==='phrase'){html=phrasebookPanel();}
if(page==='knowledge'){html=knowledgePanel();}
if(page==='more'){html=panel('<h2>🎁 上海のお土産ガイド</h2><p class="muted">中国語名、商品の特徴、購入場所の候補を掲載。チェックは端末別です。</p>')+panel(detailCards(giftDetails,'gifts'))+panel('<h2>共有のしかた</h2><p class="intro">同じURLで旅程を友人と共有できます。チェック状態は端末ごとに保存されます。</p><button class="ghost" id="share">このページのURLを共有</button>');}
document.getElementById('content').innerHTML='<div class="page-intro"><span class="page-intro-cn">'+pageThemes[page][1]+'</span><span class="page-intro-ja">'+({home:'ホーム',schedule:'日程',packing:'持ち物',food:'グルメ',more:'お土産',budget:'予算',phrase:'中国語',knowledge:'中国豆知識'}[page])+'</span></div>'+html;
document.querySelectorAll('[data-copyval]').forEach(btn=>btn.onclick=async()=>{const value=btn.dataset.copyval;try{await navigator.clipboard.writeText(value);const old=btn.textContent;btn.textContent='✓ コピーしました';setTimeout(()=>{btn.textContent=old},1700)}catch{prompt('内容をコピーしてください',value)}});
document.querySelectorAll('[data-map]').forEach(btn=>btn.onclick=()=>{
 const q=btn.dataset.map;
 const old=document.getElementById('mapPicker');if(old)old.remove();
 const overlay=document.createElement('div');overlay.id='mapPicker';
 overlay.style.cssText='position:fixed;inset:0;background:#0007;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px';
 const panelEl=document.createElement('div');panelEl.style.cssText='background:white;border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:85vh;overflow:auto';
 const heading=document.createElement('h2');heading.textContent='地図アプリを選ぶ';panelEl.appendChild(heading);
 const subtitle=document.createElement('p');subtitle.className='muted';subtitle.textContent=q;panelEl.appendChild(subtitle);
 const regionNames=['绍兴','无锡','苏州','杭州','南京','扬州','嘉兴','湖州','南浔','盐城','常州','镇江'];
 const regionCities=['绍兴','无锡','苏州','杭州','南京','扬州','嘉兴','湖州','湖州','盐城','常州','镇江'];
 const regionIndex=regionNames.findIndex(name=>q.includes(name));
 const region=regionIndex>=0?regionCities[regionIndex]:'上海';
 const choices=[
 ['高徳地図（Amap）','https://uri.amap.com/search?keyword='+encodeURIComponent(q)+'&view=map&callnative=1&src=shanghai_tabi_techo'],
 ['百度地図','https://api.map.baidu.com/place/search?query='+encodeURIComponent(q)+'&region='+encodeURIComponent(region)+'&output=html&src=webapp.shanghai.tabi'],
 ['Appleマップ','https://maps.apple.com/?q='+encodeURIComponent(q)],
 ['Googleマップ（中国本土では非推奨）','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)]
 ];
 const instructions=document.createElement('p');instructions.className='muted';instructions.textContent='地図サービスに場所名を渡して検索します。アプリが開かない場合はブラウザ版または検索語のコピーを利用してください。検索結果が複数ある場合は住所を照合してください。';panelEl.appendChild(instructions);
 choices.forEach(([label,url])=>{const a=document.createElement('a');a.textContent=label+' ↗';a.href=url;a.target='_blank';a.rel='noopener';a.style.cssText='display:block;padding:14px;border:1px solid #ead7da;border-radius:12px;margin:8px 0;text-decoration:none';panelEl.appendChild(a)});
 const copy=document.createElement('button');copy.type='button';copy.className='ghost';copy.textContent='📋 検索語をコピー';copy.style.marginRight='8px';copy.onclick=async()=>{try{await navigator.clipboard.writeText(q);copy.textContent='✓ コピーしました'}catch{prompt('検索語をコピーしてください',q)}};panelEl.appendChild(copy);
 const close=document.createElement('button');close.type='button';close.className='ghost';close.textContent='閉じる';close.onclick=()=>overlay.remove();panelEl.appendChild(close);
 overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.appendChild(panelEl);document.body.appendChild(overlay);
});

const railForm=document.getElementById('railForm');
if(railForm){
 const saved=get('rail-booking');railForm.elements.status.value=saved.status||'未予約';
 const readRail=()=>Object.fromEntries(new FormData(railForm).entries());
 railForm.onsubmit=e=>{e.preventDefault();set('rail-booking',readRail());document.getElementById('railSaveStatus').textContent='✓ この端末に保存しました';};
 document.getElementById('railCopy').onclick=async()=>{
 const d=readRail();const labels={date:'乗車日',status:'予約状況',outNum:'往路列車',outFrom:'往路乗車駅',outTo:'往路降車駅',outDep:'往路発',outArr:'往路着',outSeat:'往路座席',backNum:'復路列車',backFrom:'復路乗車駅',backTo:'復路降車駅',backDep:'復路発',backArr:'復路着',backSeat:'復路座席',price:'往復運賃（元/人）',vendor:'予約先',memo:'備考'};
 const note='【12/31 上海高速鉄道 予約メモ】\n'+Object.entries(labels).filter(([k])=>d[k]).map(([k,v])=>v+'：'+d[k]).join('\n');
 try{await navigator.clipboard.writeText(note);document.getElementById('railSaveStatus').textContent='✓ コピーしました（保存するには保存ボタンを押してください）'}catch{prompt('こちらをコピーしてください',note)}
 };
 document.getElementById('railClear').onclick=()=>{if(confirm('高速鉄道の予約メモを削除しますか？')){set('rail-booking',{});render()}};
}

document.querySelectorAll('[data-phrase-cat]').forEach(n=>n.onclick=()=>{phraseCategory=n.dataset.phraseCat;phraseFavoritesOnly=false;render()});
let search=document.getElementById('phraseSearch');if(search)search.oninput=()=>{let q=search.value.trim().toLowerCase();let visible=0;document.querySelectorAll('.phrase-card').forEach(n=>{let show=n.dataset.search.includes(q);n.style.display=show?'':'none';if(show)visible++});let empty=document.getElementById('phraseNothing');if(empty)empty.classList.toggle('hidden',visible>0)};
let favToggle=document.getElementById('phraseFavToggle');if(favToggle)favToggle.onclick=()=>{phraseFavoritesOnly=!phraseFavoritesOnly;render()};
document.querySelectorAll('[data-phrase-fav]').forEach(n=>n.onclick=()=>{let fav=get('phrase-favorites'),key=n.dataset.phraseFav;fav[key]=!fav[key];set('phrase-favorites',fav);render()});
document.querySelectorAll('[data-phrase-copy]').forEach(n=>n.onclick=async()=>{let value=n.dataset.phraseCopy;try{await navigator.clipboard.writeText(value);n.textContent='✓ コピーしました'}catch{prompt('こちらをコピーしてください',value)}});
let addressCopy=document.getElementById('copyAddress');if(addressCopy)addressCopy.onclick=async()=>{let address=hotel.zh+'\n'+hotel.address;try{await navigator.clipboard.writeText(address);addressCopy.textContent='コピーしました'}catch{prompt('ホテル情報をコピーしてください',address)}};document.querySelectorAll('[data-route]').forEach(n=>n.onclick=()=>{budgetMode=n.dataset.route;render()});document.querySelectorAll('[data-rail]').forEach(n=>n.onclick=()=>{railChoice=n.dataset.rail;render()});document.querySelectorAll('[data-yen]').forEach(n=>n.onclick=()=>{yenMode=n.dataset.yen;render()});
document.querySelectorAll('[data-day]').forEach(n=>n.onclick=()=>{day=+n.dataset.day;render()});document.querySelectorAll('[data-pack],[data-food],[data-gifts]').forEach(n=>n.onchange=()=>{let type=n.dataset.pack?'packing':n.dataset.food?'food':'gifts',key=n.dataset.pack||n.dataset.food||n.dataset.gifts,s=get(type);s[key]=n.checked;set(type,s);render()});let reset=document.getElementById('resetPacking');if(reset)reset.onclick=()=>{if(confirm('持ち物のチェックをすべて解除しますか？')){set('packing',{});render()}};let share=document.getElementById('share');if(share)share.onclick=async()=>{if(navigator.share)try{await navigator.share({title:'上海旅手帖',url:location.href});return}catch{}try{await navigator.clipboard.writeText(location.href);alert('URLをコピーしました')}catch{prompt('このURLをコピーしてください',location.href)}};}
render();
</script></body></html>
