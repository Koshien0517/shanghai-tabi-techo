function foodCatalogPanel(){
 const all=[...foodDetails,...extraFoodDetails];
 const groups=[
 ['🥟 上海・中国の定番料理',all.filter((x,i)=>i<foodDetails.length)],
 ['🍜 中国の飲食チェーン',extraFoodDetails.filter((x,i)=>i<=15)],
 ['🍣 寿司・日本式ラーメン',extraFoodDetails.filter((x,i)=>i>=16&&i<=21)],
 ['🍔 ファストフード・気軽な食事',extraFoodDetails.filter((x,i)=>i>=22)]
 ];
 return groups.map(([title,items])=>panel('<h2>'+title+' <small class="catalog-count">'+items.length+'件</small></h2>'+detailCards(items,'food'))).join('');
}

 if(phraseFavoritesOnly)entries=entries.filter(x=>fav[x[0]]);
 return panel('<span class="tag">中国語 · 旅行会話</span><h2 style="margin-top:12px">🗣️ 旅先ですぐ見せる中国語</h2><p class="intro">簡体字・ピンイン・日本語訳をセットで表示。中国語をコピーして店員さんや駅員さんに見せることもできます。</p><p class="hint">食事：同行者は辛い料理が基本NG。あなたは少し辛くてもOK。2人とも魚・羊肉は控えめに。点心・チャーハン・餃子は上海滞在中に食べる必須メニューです。</p><div class="phrase-cats">'+groups.map(x=>`<button class="phrase-tab ${x===selected?'active':''}" data-phrase-cat="${esc(x)}" aria-pressed="${x===selected}">${esc(x)}</button>`).join('')+'</div><div class="phrase-tools"><input type="search" id="phraseSearch" placeholder="選択中のカテゴリを検索（全件は🔎 全フレーズ）" aria-label="会話フレーズ検索"><button id="phraseFavToggle" class="ghost" aria-pressed="'+phraseFavoritesOnly+'">'+(phraseFavoritesOnly?'★ お気に入りのみ':'☆ お気に入りのみ')+'</button></div><p class="muted">'+entries.length+'フレーズ · ☆でお気に入り保存（端末ごと）</p><div id="phraseList">'+(entries.length?entries.map(([zh,pinyin,ja,cat])=>`<article class="phrase-card" data-search="${esc((zh+' '+pinyin+' '+ja).toLowerCase())}"><div class="phrase-header"><span class="phrase-zh" lang="zh-CN">${esc(zh)}</span><button class="phrase-star" aria-label="お気に入り切替：${esc(ja)}" data-phrase-fav="${esc(zh)}">${fav[zh]?'★':'☆'}</button></div><div class="phrase-pinyin">${esc(pinyin)}</div><p class="phrase-ja">${esc(ja)}</p><button class="copy-btn" data-phrase-copy="${esc(zh)}">📋 中国語をコピー</button></article>`).join(''):'<p class="muted">お気に入りはまだありません。各フレーズの☆から追加できます。</p>')+'</div><p id="phraseNothing" class="muted hidden">該当するフレーズがありません。</p>')
}

const MAIN_TRIP='shanghai-2026';
const MAIN_START='2026-12-30';

function allTrips(){const x=get('trips');return Array.isArray(x)?x.filter(t=>t&&typeof t.id==='string'&&typeof t.title==='string'):[]}
function selectedTrip(){const k=get('current-trip');return typeof k==='string'&&(k===MAIN_TRIP||allTrips().some(t=>t.id===k))?k:MAIN_TRIP}
function tripById(id){return allTrips().find(t=>t.id===id)}
function currentTrip(){return selectedTrip()===MAIN_TRIP?{id:MAIN_TRIP,title:'上海旅行 2026–27',start:MAIN_START,end:MAIN_END,currency:'CNY',days:[]}:tripById(selectedTrip())}

async function importBackup(file){
 if(!file||file.size>3*1024*1024)throw Error('3MB以下のJSONファイルを選んでください。');
 const obj=JSON.parse(await file.text());if(!obj||obj.format!=='shanghai-tabi-techo-backup'||obj.schema!==1||!obj.items||typeof obj.items!=='object'||Array.isArray(obj.items))throw Error('このアプリのバックアップ形式ではありません。');
 const entries=Object.entries(obj.items);
 if(entries.length>250)throw Error('保存項目数が上限を超えています。');
 for(const [k,v] of entries){if(!/^shanghai-free-[a-z0-9-]{1,90}$/.test(k)||typeof v!=='string'||v.length>1000000)throw Error('バックアップの内容に不正な項目があります。');JSON.parse(v)}
 if(!confirm(entries.length+'件の保存項目を復元します。同名のデータは上書きされます。よろしいですか？'))return false;
 const old=entries.map(([k])=>[k,localStorage.getItem(k)]);
 try{entries.forEach(([k,v])=>localStorage.setItem(k,v))}catch(err){old.forEach(([k,v])=>{if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)});throw err}
 return true;
}

/* Shared static travel facts and per-device safety/settlement tools */
function settleExpenses(items){
 let selfPaid=0,friendPaid=0,selfShare=0,friendShare=0,unknown=0;
 for(const e of items){
  const amt=Number(e.amount),payer=String(e.payer||'').trim(),split=e.split||'half';
  if(!(amt>0)||!Number.isFinite(amt))continue;
  if(!['自分','友人'].includes(payer)||!['half','self','friend'].includes(split)){unknown++;continue}
  const share=split==='self'?amt:split==='friend'?0:amt/2;
  selfShare+=share;friendShare+=amt-share;
  if(payer==='自分')selfPaid+=amt;else friendPaid+=amt;
 }
 const round=x=>Math.round(x*100)/100;
 return {selfPaid:round(selfPaid),friendPaid:round(friendPaid),selfShare:round(selfShare),friendShare:round(friendShare),balance:round(selfPaid-selfShare),unknown};
}

async function checkOffline(saveNow){
 const out=document.getElementById('offlineResult');if(!out)return;
 if(!('caches' in window)||!('serviceWorker' in navigator)){out.textContent='この環境ではPWAオフライン保存を確認できません。';return}
 out.textContent='保存状態を確認しています…';
 try{
  if(saveNow&&!navigator.onLine)throw Error('保存には通信が必要です');
  const reg=await navigator.serviceWorker.getRegistration('./');if(!reg)throw Error('PWAの登録がありません。オンラインでアプリを開き直してください');
  const keys=(await caches.keys()).filter(k=>k.startsWith('shanghai-tabi-techo-pwa-')).sort((a,b)=>Number(b.split('-v').pop())-Number(a.split('-v').pop()));
  if(!keys.length)throw Error('PWA用キャッシュが見つかりません');
  const cache=await caches.open(keys[0]),paths=['./index.html','./manifest.webmanifest','./icons/icon-192.png','./icons/icon-512.png'];
  if(saveNow){for(const p of paths){const res=await fetch(p,{cache:'reload'});if(!res.ok)throw Error('取得失敗 '+p);await cache.put(p,res)}}
  const checks=await Promise.all(paths.map(p=>cache.match(p))),count=checks.filter(Boolean).length;
  out.textContent=count===paths.length?'✓ 基本ファイル '+count+'/'+paths.length+' 件が保存済みです。通信なしでも主要画面を表示できます。':'保存済み '+count+'/'+paths.length+' 件。通信があるときに「保存」を押してください。';
 }catch(e){out.textContent='保存状態を確認できません：'+e.message}
}

 panel.onclick=e=>{if(e.target===panel)panel.remove()};panel.appendChild(child);document.body.appendChild(panel);
});

document.querySelectorAll('[data-copyval]').forEach(btn=>btn.onclick=async()=>{const value=btn.dataset.copyval;try{await navigator.clipboard.writeText(value);const old=btn.textContent;btn.textContent='✓ コピーしました';setTimeout(()=>{btn.textContent=old},1700)}catch{prompt('内容をコピーしてください',value)}});
document.querySelectorAll('[data-map]').forEach(btn=>btn.onclick=()=>{
 const q=btn.dataset.map;
 const old=document.getElementById('mapPicker');if(old)old.remove();
 const overlay=document.createElement('div');overlay.id='mapPicker';
 overlay.style.cssText='position:fixed;inset:0;background:#0007;z-index:99;display:flex;align-items:center;justify-content:center;padding:20px';
 const panelEl=document.createElement('div');panelEl.style.cssText='background:white;border-radius:20px;padding:20px;max-width:420px;width:100%;max-height:85vh;overflow:auto';
 const heading=document.createElement('h2');heading.textContent='地図アプリを選ぶ';panelEl.appendChild(heading);
 const subtitle=document.createElement('p');subtitle.className='muted';subtitle.textContent=q;panelEl.appendChild(subtitle);
 const regionNames=['绍兴','无锡','苏州','杭州','南京','扬州','嘉兴','湖州','南浔','盐城','常州','镇江'];
 const regionCities=['绍兴','无锡','苏州','杭州','南京','扬州','嘉兴','湖州','湖州','盐城','常州','镇江'];
 const regionIndex=regionNames.findIndex(name=>q.includes(name));
 const region=regionIndex>=0?regionCities[regionIndex]:'上海';
 const choices=[
 ['高徳地図（Amap）','https://uri.amap.com/search?keyword='+encodeURIComponent(q)+'&view=map&callnative=1&src=shanghai_tabi_techo'],
 ['百度地図','https://api.map.baidu.com/place/search?query='+encodeURIComponent(q)+'&region='+encodeURIComponent(region)+'&output=html&src=webapp.shanghai.tabi'],
 ['Appleマップ','https://maps.apple.com/?q='+encodeURIComponent(q)],
 ['Googleマップ（中国本土では非推奨）','https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)]
 ];
 const instructions=document.createElement('p');instructions.className='muted';instructions.textContent='地図サービスに場所名を渡して検索します。アプリが開かない場合はブラウザ版または検索語のコピーを利用してください。検索結果が複数ある場合は住所を照合してください。';panelEl.appendChild(instructions);
 choices.forEach(([label,url])=>{const a=document.createElement('a');a.textContent=label+' ↗';a.href=url;a.target='_blank';a.rel='noopener';a.style.cssText='display:block;padding:14px;border:1px solid #ead7da;border-radius:12px;margin:8px 0;text-decoration:none';panelEl.appendChild(a)});
 const copy=document.createElement('button');copy.type='button';copy.className='ghost';copy.textContent='📋 検索語をコピー';copy.style.marginRight='8px';copy.onclick=async()=>{try{await navigator.clipboard.writeText(q);copy.textContent='✓ コピーしました'}catch{prompt('検索語をコピーしてください',q)}};panelEl.appendChild(copy);
 const close=document.createElement('button');close.type='button';close.className='ghost';close.textContent='閉じる';close.onclick=()=>overlay.remove();panelEl.appendChild(close);
 overlay.onclick=e=>{if(e.target===overlay)overlay.remove()};overlay.appendChild(panelEl);document.body.appendChild(overlay);
});

const railForm=document.getElementById('railForm');
if(railForm){
 const saved=get('rail-booking');railForm.elements.status.value=saved.status||'未予約';
 const readRail=()=>Object.fromEntries(new FormData(railForm).entries());
 railForm.onsubmit=e=>{e.preventDefault();set('rail-booking',readRail());document.getElementById('railSaveStatus').textContent='✓ この端末に保存しました';};
 document.getElementById('railCopy').onclick=async()=>{
 const d=readRail();const labels={date:'乗車日',status:'予約状況',outNum:'往路列車',outFrom:'往路乗車駅',outTo:'往路降車駅',outDep:'往路発',outArr:'往路着',outSeat:'往路座席',backNum:'復路列車',backFrom:'復路乗車駅',backTo:'復路降車駅',backDep:'復路発',backArr:'復路着',backSeat:'復路座席',price:'往復運賃（元/人）',vendor:'予約先',memo:'備考'};
 const note='【12/31 上海高速鉄道 予約メモ】\n'+Object.entries(labels).filter(([k])=>d[k]).map(([k,v])=>v+'：'+d[k]).join('\n');
 try{await navigator.clipboard.writeText(note);document.getElementById('railSaveStatus').textContent='✓ コピーしました（保存するには保存ボタンを押してください）'}catch{prompt('こちらをコピーしてください',note)}
 };
 document.getElementById('railClear').onclick=()=>{if(confirm('高速鉄道の予約メモを削除しますか？')){set('rail-booking',{});render()}};
}

document.querySelectorAll('[data-phrase-cat]').forEach(n=>n.onclick=()=>{phraseCategory=n.dataset.phraseCat;phraseFavoritesOnly=false;render()});
let search=document.getElementById('phraseSearch');if(search)search.oninput=()=>{let q=search.value.trim().toLowerCase();let visible=0;document.querySelectorAll('.phrase-card').forEach(n=>{let show=n.dataset.search.includes(q);n.style.display=show?'':'none';if(show)visible++});let empty=document.getElementById('phraseNothing');if(empty)empty.classList.toggle('hidden',visible>0)};
let favToggle=document.getElementById('phraseFavToggle');if(favToggle)favToggle.onclick=()=>{phraseFavoritesOnly=!phraseFavoritesOnly;render()};
document.querySelectorAll('[data-phrase-fav]').forEach(n=>n.onclick=()=>{let fav=get('phrase-favorites'),key=n.dataset.phraseFav;fav[key]=!fav[key];set('phrase-favorites',fav);render()});
document.querySelectorAll('[data-phrase-copy]').forEach(n=>n.onclick=async()=>{let value=n.dataset.phraseCopy;try{await navigator.clipboard.writeText(value);n.textContent='✓ コピーしました'}catch{prompt('こちらをコピーしてください',value)}});
let addressCopy=document.getElementById('copyAddress');if(addressCopy)addressCopy.onclick=async()=>{let address=hotel.zh+'\n'+hotel.address;try{await navigator.clipboard.writeText(address);addressCopy.textContent='コピーしました'}catch{prompt('ホテル情報をコピーしてください',address)}};document.querySelectorAll('[data-route]').forEach(n=>n.onclick=()=>{budgetMode=n.dataset.route;render()});document.querySelectorAll('[data-rail]').forEach(n=>n.onclick=()=>{railChoice=n.dataset.rail;render()});document.querySelectorAll('[data-yen]').forEach(n=>n.onclick=()=>{yenMode=n.dataset.yen;render()});

const tripSelect=document.getElementById('tripSelect');if(tripSelect)tripSelect.onchange=()=>{set('current-trip',tripSelect.value);day=0;render()};
const create=document.getElementById('tripCreateForm');if(create)create.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(create).entries());if(!validYmd(d.start)||!validYmd(d.end)||d.end<d.start){document.getElementById('tripMessage').textContent='終了日は開始日以降にしてください。';return}const id='trip-'+Date.now()+'-'+Math.random().toString(36).slice(2,8);const trips=allTrips();trips.push({id,title:d.title.trim(),start:d.start,end:d.end,currency:d.currency,days:[]});set('trips',trips);set('current-trip',id);render()};
const edit=document.getElementById('tripEditForm');if(edit)edit.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(edit).entries());if(!validYmd(d.start)||!validYmd(d.end)||d.end<d.start){alert('日付を確認してください');return}let trips=allTrips(),t=trips.find(x=>x.id===selectedTrip());if(!t)return;t.title=d.title.trim();t.start=d.start;t.end=d.end;t.currency=d.currency;t.days=(t.days||[]).filter(x=>x.date>=t.start&&x.date<=t.end);set('trips',trips);render()};
const del=document.getElementById('tripDelete');if(del)del.onclick=()=>{const t=currentTrip();if(t.id===MAIN_TRIP)return;if(confirm('「'+t.title+'」とこの旅行の支出記録を削除しますか？')){set('trips',allTrips().filter(x=>x.id!==t.id));localStorage.removeItem('shanghai-free-expenses-'+t.id);set('current-trip',MAIN_TRIP);render()}};
const eventForm=document.getElementById('tripEventForm');if(eventForm)eventForm.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(eventForm).entries());let trips=allTrips(),t=trips.find(x=>x.id===selectedTrip());if(!t||d.date<t.start||d.date>t.end){alert('旅行期間内の日付を選んでください');return}let day=t.days.find(x=>x.date===d.date);if(!day){day={date:d.date,name:d.date,events:[]};t.days.push(day)}day.events.push([d.time,d.label,d.details||'',d.place||'']);day.events.sort((a,b)=>String(a[0]).localeCompare(String(b[0])));t.days.sort((a,b)=>a.date.localeCompare(b.date));set('trips',trips);render()};
document.querySelectorAll('[data-remove-event]').forEach(n=>n.onclick=()=>{const val=n.dataset.removeEvent;if(!confirm('この予定を削除しますか？'))return;let trips=allTrips(),t=trips.find(x=>x.id===selectedTrip());if(!t)return;const d=t.days.find(x=>val.startsWith(x.date+'_'));if(!d)return;const ix=d.events.findIndex(e=>d.date+'_'+e[0]+'_'+e[1]===val);if(ix>=0)d.events.splice(ix,1);t.days=t.days.filter(x=>x.events.length);set('trips',trips);render()});
const expense=document.getElementById('expenseForm');if(expense)expense.onsubmit=e=>{e.preventDefault();const d=Object.fromEntries(new FormData(expense).entries()),amount=Number(d.amount);if(!Number.isFinite(amount)||amount<=0||amount>99999999||!validYmd(d.date))return;const arr=tripExpenses();arr.push({...d,id:'expense-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),amount:Math.round(amount*100)/100});set('expenses-'+selectedTrip(),arr);render()};
document.querySelectorAll('[data-expense-delete]').forEach(n=>n.onclick=()=>{if(confirm('支出を削除しますか？')){set('expenses-'+selectedTrip(),tripExpenses().filter(e=>e.id!==n.dataset.expenseDelete));render()}});
const expBtn=document.getElementById('backupExport');if(expBtn)expBtn.onclick=()=>{try{exportBackup()}catch(err){document.getElementById('backupStatus').textContent='出力に失敗しました：'+err.message}};
const impBtn=document.getElementById('backupImport');if(impBtn)impBtn.onclick=async()=>{const f=document.getElementById('backupFile').files[0];const msg=document.getElementById('backupStatus');try{const ok=await importBackup(f);msg.textContent=ok?'復元しました。画面を再読み込みします。':'復元を取り消しました。';if(ok)render()}catch(err){msg.textContent='復元できません：'+err.message}};
const ver=document.getElementById('appUpdateCheck');if(ver)ver.onclick=checkAppVersion;

document.querySelectorAll('[data-day]').forEach(n=>n.onclick=()=>{day=+n.dataset.day;render()});document.querySelectorAll('[data-pack],[data-food],[data-gifts]').forEach(n=>n.onchange=()=>{let type=n.dataset.pack?'packing':n.dataset.food?'food':'gifts',key=n.dataset.pack||n.dataset.food||n.dataset.gifts,s=get(type);s[key]=n.checked;set(type,s);render()});let reset=document.getElementById('resetPacking');if(reset)reset.onclick=()=>{if(confirm('持ち物のチェックをすべて解除しますか？')){set('packing',{});render()}};let share=document.getElementById('share');if(share)share.onclick=async()=>{if(navigator.share)try{await navigator.share({title:'上海旅手帖',url:location.href});return}catch{}try{await navigator.clipboard.writeText(location.href);alert('URLをコピーしました')}catch{prompt('このURLをコピーしてください',location.href)}};}
try{const restore=sessionStorage.getItem('shanghai-update-page');if(restore&&navItems.some(x=>x[0]===restore)){page=restore;day=Number(sessionStorage.getItem('shanghai-update-day'))||0}sessionStorage.removeItem('shanghai-update-page');sessionStorage.removeItem('shanghai-update-day')}catch{}
render();
const updateNowButton=document.getElementById('updateNow');if(updateNowButton)updateNowButton.addEventListener('click',updateAppNow);
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(err=>console.warn('オフライン機能の登録に失敗しました',err));});}
</script></body></html>
